apiVersion: apps/v1
# WHY STATEFULSET: Databases need sticky, permanent names (postgres-0) to ensure they connect 
# back to the exact same hard drive if they restart. Deployments are for stateless apps.
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: "postgres"
        # WHY SECRETKEYREF: We don't hardcode the database password. This looks inside the 
        # 'postgres-secret' (generated by Vault) and injects it securely.
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  
  # WHY DYNAMIC PROVISIONING: This automatically generates the PVC on the fly!
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      # WATCH OUT: Databases cannot be ReadWriteMany. Only one pod can mount the drive at a time.
      accessModes: [ "ReadWriteOnce" ]
      # WHY storageClassName: Tells Kubernetes WHICH storage driver to use for dynamic provisioning.
      # On Minikube: use 'standard' (hostPath provisioner, no multi-node replication).
      # On real VMs: change to 'longhorn' to get data replication across nodes for HA.
      storageClassName: standard
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  ports:
  - port: 5432
  selector:
    app: postgres
